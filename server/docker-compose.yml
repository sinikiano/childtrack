services:
  childtrack:
    build: .
    image: childtrack:latest
    container_name: childtrack
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/data/childtrack.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data

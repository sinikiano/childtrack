# Replace track.example.com with your own domain.
server {
    listen 80;
    server_name track.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name track.example.com;

    # certbot --nginx will fill these in
    # ssl_certificate     /etc/letsencrypt/live/track.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/track.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/events): don't buffer or kill long-lived connections
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
